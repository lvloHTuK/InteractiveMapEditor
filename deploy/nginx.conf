# Reverse proxy for the Map Editor app (Node process on 127.0.0.1:4000).
# Copy to /etc/nginx/sites-available/mapeditor.conf and symlink into
# sites-enabled, then run `certbot --nginx -d your-domain.example` to
# add HTTPS (it will rewrite this file to add the 443 server block).
#
# Replace your-domain.example below with your actual domain.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example;

    # Uploaded map images can be large; match the app's own upload limit
    # (50MB for map PNGs, see server/src/routes/projects.ts).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
